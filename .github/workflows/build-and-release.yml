name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pillow

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Create Portable Zip
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          $portableDir = "FTIRdex-$version-portable"
          New-Item -ItemType Directory -Path $portableDir | Out-Null
          
          # Copy release binary and assets
          Copy-Item "build\Release\FTIRdex.exe" -Destination "$portableDir\"
          Copy-Item "build\Release\process_ftir.py" -Destination "$portableDir\"
          Copy-Item "build\Release\icon.ico" -Destination "$portableDir\"
          Copy-Item "build\Release\JetBrainsMono-Regular.ttf" -Destination "$portableDir\"
          Copy-Item "associate_portable.ps1" -Destination "$portableDir\"
          
          # Copy FTIRlib recursively
          Copy-Item -Path "build\Release\FTIRlib" -Destination "$portableDir\" -Recurse
          
          # Exclude the heavy recuperacion-historica folder
          $excludePath = Join-Path $portableDir "FTIRlib\recuperacion-historica"
          if (Test-Path $excludePath) {
              Remove-Item -Path $excludePath -Recurse -Force
          }
          
          Compress-Archive -Path "$portableDir" -DestinationPath "FTIRdex-$version-portable.zip"
          Remove-Item -Path $portableDir -Recurse -Force

      - name: Convert PNG assets to BMP
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('assets/sidebar_banner.png').convert('RGB').save('assets/sidebar_banner.bmp')"
          python -c "from PIL import Image; Image.open('assets/logo_top_small.png').convert('RGB').save('assets/logo_top_small.bmp')"

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          iscc.exe installer.iss

      - name: Create Source Tarball
        shell: bash
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          tar --exclude='./build' --exclude='./.git' --exclude='./.github' \
            --exclude='./FTIRlib/recuperacion-historica' \
            --exclude="./FTIRdex-$VERSION-portable.zip" \
            --exclude="./FTIRdex-$VERSION-installer-x64.exe" \
            -czf ../FTIRdex-$VERSION-source.tar.gz .
          mv ../FTIRdex-$VERSION-source.tar.gz .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FTIRdex-Build-Artifacts
          path: |
            FTIRdex-*-portable.zip
            **/FTIRdex-*-installer-x64.exe
            FTIRdex-*-source.tar.gz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            FTIRdex-*-portable.zip
            **/FTIRdex-*-installer-x64.exe
            FTIRdex-*-source.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
